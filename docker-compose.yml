# ============================================================================
# ProdPlan ONE — docker-compose.yml
# ============================================================================
#
# ⚠️  DEV-ONLY.  Production on the Nelo server runs NATIVELY via
#    `deploy/install.sh` + systemd (Postgres, Redis, Ollama, uvicorn —
#    all as apt/pip packages). See `docs/deployment-native.md`.
#
# This file exists purely so developers on Windows/Mac can spin up the
# two dependencies (Postgres + Redis) in one command and focus on code.
# Nothing here ends up in production.
#
# Services dropped intentionally (vs the previous version):
#   • zookeeper + kafka + kafka-ui
#       → replaced by the transactional outbox pattern in Postgres
#         (event_outbox table, migration 003) + LISTEN/NOTIFY for
#         intra-process consumers. Zero Kafka dependency on Nelo.
#   • api (python container)
#       → on dev we run `uvicorn src.main:app --reload` straight from the
#         venv for fast feedback; on prod we run it via systemd.
#
# Usage (dev):
#   cp .env.example .env && edit .env  (set POSTGRES_PASSWORD + REDIS_PASSWORD)
#   docker compose up -d postgres redis
#   source .venv/bin/activate && uvicorn src.main:app --reload
# ============================================================================
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prodplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prodplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prodplan_one}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prodplan} -d ${POSTGRES_DB:-prodplan_one}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prodplan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
