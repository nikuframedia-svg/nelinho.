# ProdPlan ONE — system_defaults.yaml
# Sprint Q.17.A foundation. Generated from src/core/services/default_configs.py.
# Edit this file directly going forward; default_configs.iter_seeds() reads it.
#
# Total settings: 183
# Categories: 31
#
version: 1
schema_name: system_defaults.v1
categories:
  governance:
    description: Write-gate, auto-approval flags, timeline anti-fatigue.
    settings:
    - key: auto_approval.reschedule_order.enabled
      value: false
      data_type: bool
      description: WG07 — auto-approve cheap schedule changes when risk is low
    - key: auto_approval.reschedule_order.risk_ceiling
      value: LOW
      data_type: string
      description: Only LOW-risk decisions auto-approve when enabled
    - key: auto_approval.stock_adjustment.enabled
      value: false
      data_type: bool
      description: ''
    - key: auto_approval.stock_adjustment.risk_ceiling
      value: LOW
      data_type: string
      description: ''
    - key: auto_approval.model_promotion.enabled
      value: true
      data_type: bool
      description: ''
    - key: auto_approval.model_promotion.risk_ceiling
      value: LOW
      data_type: string
      description: ''
    - key: timeline.hide_low_risk_default
      value: false
      data_type: bool
      description: 'WG08 — anti-approval-fatigue: hide LOW risk by default in timeline'
    - key: timeline.max_per_user_shown
      value: 25
      data_type: int
      description: WG08 — cap items visible per reviewer to avoid overwhelm
  trust:
    description: Trust Index v2 weights and gating thresholds.
    settings:
    - key: weights.completeness
      value: 0.15
      data_type: float
      description: ''
    - key: weights.validity
      value: 0.2
      data_type: float
      description: ''
    - key: weights.freshness
      value: 0.15
      data_type: float
      description: ''
    - key: weights.consistency
      value: 0.2
      data_type: float
      description: ''
    - key: weights.provenance
      value: 0.15
      data_type: float
      description: ''
    - key: weights.anomaly
      value: 0.1
      data_type: float
      description: ''
    - key: weights.evidence
      value: 0.05
      data_type: float
      description: ''
    - key: gates.solver_suggestion_only
      value: 0.5
      data_type: float
      description: Blueprint v2.0 §4.5 — below 0.50, solver runs in suggestion mode only
    - key: gates.use_p90_durations
      value: 0.6
      data_type: float
      description: Below 0.60, use P90 durations (larger buffers)
    - key: gates.auto_reorder
      value: 0.7
      data_type: float
      description: Below 0.70, disable automatic reorder
    - key: gates.auto_commit
      value: 0.75
      data_type: float
      description: Below 0.75, no auto-commit (human must approve)
    - key: gates.quality_disposition
      value: 0.8
      data_type: float
      description: Below 0.80, block quality disposition
    - key: freshness.tau_seconds_curated
      value: 86400.0
      data_type: float
      description: Freshness time-constant tau for curated data (1 day)
    - key: consistency.kappa
      value: 2.0
      data_type: float
      description: Z-score softening for consistency
  planning:
    description: CPO v4 scheduler — population, fitness weights, queue/buffer, MAP-Elites grid, surrogate.
    settings:
    - key: cpo.pop_size
      value: 100
      data_type: int
      description: Blueprint v2.0 §5.5 — GA population
    - key: cpo.gen_count
      value: 200
      data_type: int
      description: Blueprint v2.0 — GA generations (was 50 in Sprint F; v2.0 requires 200)
    - key: cpo.total_budget_s
      value: 60.0
      data_type: float
      description: Target end-to-end CPO cascade budget
    - key: cpo.greedy_budget_s
      value: 2.0
      data_type: float
      description: Greedy 8-phase baseline budget
    - key: cpo.ga_budget_s
      value: 30.0
      data_type: float
      description: ''
    - key: cpo.mapelites_budget_s
      value: 5.0
      data_type: float
      description: ''
    - key: cpo.cpsat_budget_s
      value: 15.0
      data_type: float
      description: CP-SAT L-RHO rolling horizon
    - key: cpo.workforce_budget_s
      value: 3.0
      data_type: float
      description: Hungarian workforce assignment budget
    - key: cpo.use_frrmab
      value: true
      data_type: bool
      description: ''
    - key: cpo.use_mapelites
      value: true
      data_type: bool
      description: ''
    - key: cpo.use_surrogate
      value: false
      data_type: bool
      description: Requires ≥20 real samples before enabling
    - key: cpo.use_cpsat_lrho
      value: true
      data_type: bool
      description: Sprint P.10 — Rolling Horizon L-RHO (ex-deferred I.2)
    - key: cpo.use_queue_time
      value: true
      data_type: bool
      description: Q.173.L — fila inter-fase mediana por fase no decoder (true,
        default) vs one-piece-flow fila=0 (false). Lida por _build_cpo_config.
    - key: cpo.cpsat_gate.soft_waiver_gain
      value: 0.5
      data_type: float
      description: Q.173.P — isenta os guardrails SOFT do gate axioma-7 quando o
        CP-SAT corta o makespan >= esta fração vs baseline (0 = desligado). Hard
        guardrails (tardiness, late orders, OTD, cap 1.5x) vetam sempre.
    - key: repair.phase_ids
      value: [14, 76, 77]
      data_type: json
      description: Q.173.L — fases de REPARAÇÃO para o planeador (prioridade no
        loader + exclusão no CP-SAT global). A view v_of_em_producao continua
        {14,76,77} hardcoded na BD — mudar aqui governa só o solver.
    - key: auto_replan_plan_cap
      value: 0
      data_type: int
      description: Q.161.B — cap de ordens do robô de fundo (0 = todos os
        em-produção). Lido por auto_cpo_replan_job.
    - key: auto_replan_time_limit_s
      value: 300.0
      data_type: float
      description: Q.162.A — budget do SOLVER do robô (<< job_timeout 1200s do
        Arq). Lido por auto_cpo_replan_job.
    - key: manual_override.ttl_days
      value: 14
      data_type: int
      description: Q.173.R — validade (dias) de um ajuste manual do plano sem
        aprovação LIVE; <=0 desliga. Sem TTL, um override órfão re-aplicava-se
        para sempre (a janela só fechava com um LIVE).
    - key: fitness.weight.makespan
      value: 0.2
      data_type: float
      description: ''
    - key: fitness.weight.tardiness_transport
      value: 0.25
      data_type: float
      description: Transport dates are king
    - key: fitness.weight.idle_operators
      value: 0.15
      data_type: float
      description: ''
    - key: fitness.weight.setup_time
      value: 0.15
      data_type: float
      description: ''
    - key: fitness.weight.quality_risk
      value: 0.1
      data_type: float
      description: ''
    - key: fitness.weight.throughput_eur_day
      value: 0.15
      data_type: float
      description: Negated internally so throughput maximisation reduces fitness
    - key: fitness.quality_hard_threshold
      value: 0.4
      data_type: float
      description: Sprint I.3 — P(error)>threshold incurs hard_penalty per op
    - key: fitness.quality_hard_penalty
      value: 100.0
      data_type: float
      description: ''
    - key: fitness.truck_consolidation_weight
      value: 2.0
      data_type: float
      description: Sprint P.3 — penalty for spreading same-batch ops over time
    - key: fitness.truck_consolidation_tolerance_h
      value: 12.0
      data_type: float
      description: ''
    - key: scheduler.direction
      value: backward
      data_type: string
      description: PL14 — default backward from transport_date
    - key: transport.default_batch_size
      value: 50
      data_type: int
      description: CG11 — 50 barcos/camião
    - key: transport.delivery_buffer_h
      value: 24.0
      data_type: float
      description: Hours before transport_date the order must be ready
    - key: queue_time.median_h
      value: 5.2
      data_type: float
      description: PL22 — mediana 5.2h entre fases consecutivas
    - key: queue_time.p90_h
      value: 69.2
      data_type: float
      description: ''
    - key: buffer.post_desmolde_h
      value: 4.0
      data_type: float
      description: PL21 — buffer após Desmolde (ponto QC de facto)
    - key: laminagem.require_pair
      value: true
      data_type: bool
      description: WF11 — Laminagem standard sempre 2 workers (88.5% das operações históricas em FuncionariosFaseOrdemFabrico).
        NÃO usar CoeficienteX como critério — é prémio monetário (€), não tempo.
    - key: laminagem.require_chefe
      value: true
      data_type: bool
      description: Pair must include an experienced worker (chefe)
    - key: mold.max_pocket_count
      value: 7
      data_type: int
      description: ''
    - key: routing.templates.count
      value: 61
      data_type: int
      description: PL08/CG07 — 61 padrões únicos de routing por sequência (v2.0 §3.1)
    - key: replan.on_capacity_change
      value: true
      data_type: bool
      description: ''
    - key: replan.on_routing_change
      value: true
      data_type: bool
      description: ''
    - key: mapelites.bins.lam_utilization
      value: 10
      data_type: int
      description: v2.0 §5.5 — X axis bins (utilização laminagem 0-100%)
    - key: mapelites.bins.tardiness_transport
      value: 10
      data_type: int
      description: Y axis bins (atraso máximo vs transporte 0 a +14 dias)
    - key: mapelites.bins.idle_pct
      value: 5
      data_type: int
      description: Z axis bins (operadores idle 0-50%)
    - key: mapelites.representatives_default
      value: 8
      data_type: int
      description: WG10 — alternativas mostradas no Timeline
    - key: surrogate.threshold_factor
      value: 1.2
      data_type: float
      description: Skip candidates >1.2x worse than best-known
    - key: surrogate.retrain_every
      value: 50
      data_type: int
      description: Re-train surrogate every N real GA evaluations
    - key: surrogate.min_samples_enable
      value: 20
      data_type: int
      description: ''
  supply:
    description: Stock/material reorder thresholds and approval gates.
    settings:
    - key: safety_multiplier
      value: 1.0
      data_type: float
      description: MR05 — multiplier on calculated reorder points
    - key: stockout_critical_days
      value: 3
      data_type: int
      description: Days-to-stockout below which MATERIAL_STOCKOUT_IMMINENT fires
    - key: adjust.auto_approve_threshold_qty
      value: 5.0
      data_type: float
      description: '|qty_delta| above this requires governance approval (MR06 / ST01)'
  quality:
    description: Quality risk thresholds + rework buffers per phase.
    settings:
    - key: risk_alert_threshold
      value: 0.4
      data_type: float
      description: QA07 — emit preventive alert when P(error) > threshold
    - key: rework_buffer_pct.sanding_water
      value: 0.2
      data_type: float
      description: QA11 — buffer 20% pós Lixagem água (19.149 retornos histórico)
    - key: rework_buffer_pct.sanding_polish
      value: 0.2
      data_type: float
      description: QA11 — buffer 20% pós Lixagem polimento (16.221 retornos)
    - key: rework_buffer_pct.painting_finishing
      value: 0.18
      data_type: float
      description: QA11 — buffer 18% pós Pintura Acabamento (12.826 retornos)
    - key: skill_bottleneck_threshold
      value: 25
      data_type: int
      description: WF12 — fases com < N workers aptos flagged as skill bottleneck (Pintura=22, Colagem
        Golas=13, Desmolde=16)
    - key: duplicates.severity
      value: WARNING
      data_type: string
      description: Severity reported by the duplicate-business-keys quality gate
        (blocking|warning|info). Q.67.1.C — default WARNING preserves NELO behaviour
        (the transform step dedupes by business key + ingestion_id); tenants with
        already-clean data may escalate to BLOCKING via /regras → quality.
  mold:
    description: Mould health weights and maintenance threshold.
    settings:
    - key: maintenance_threshold_cycles
      value: 0
      data_type: int
      description: QA10/CG12/AL08 — cycles before MOLD_MAINT_DUE alert. ≤0 disables (NELO default). Override
        per-tenant if a numeric policy exists.
    - key: health_weight.cycles
      value: 0.4
      data_type: float
      description: ''
    - key: health_weight.defects_90d
      value: 0.2
      data_type: float
      description: ''
    - key: health_weight.days_since_maint
      value: 0.2
      data_type: float
      description: ''
    - key: health_weight.rework_rate
      value: 0.2
      data_type: float
      description: ''
    - key: health.red_threshold
      value: 40
      data_type: int
      description: Health score below this flags the mold RED
    - key: health.yellow_threshold
      value: 70
      data_type: int
      description: Health score below this flags YELLOW
  cost:
