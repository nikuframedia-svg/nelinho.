    settings:
    - key: snapshot.cache_ttl_seconds
      value: 30
      data_type: int
      description: ''
    - key: shortage.horizon_days_default
      value: 14
      data_type: int
      description: ''
    - key: projection.days_ahead_default
      value: 7
      data_type: int
      description: ''
  workforce:
    description: Worker tier boundaries, shift defaults, skill recency window.
    settings:
    - key: skill_tier.junior_max_months
      value: 5
      data_type: int
      description: 'WF05 — tier boundary: junior < 5 months'
    - key: skill_tier.mid_max_months
      value: 12
      data_type: int
      description: 'WF05 — tier boundary: mid < 12 months'
    - key: shift.default_hours_per_day
