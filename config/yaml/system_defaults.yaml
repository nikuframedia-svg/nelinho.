    - key: weekly.enabled
      value: true
      data_type: bool
      description: Send a weekly KPI digest every Monday.
    - key: format
      value: pdf
      data_type: string
      description: 'Export format for the dashboard: pdf | xlsx | both.'
    - key: ceo.recipients
      value: ''
      data_type: string
      description: Comma-separated emails for the CEO digest. Empty = print only.
  tablet:
    description: Operator-tablet refresh rate, font scale, kiosk mode, offline buffer.
    settings:
    - key: refresh.seconds
      value: 15
      data_type: int
      description: How often the tablet polls /v1/operador/queue.
    - key: ui.font_scale
      value: 1.0
      data_type: float
      description: Multiplier for default font size (1.0 = neutral, 1.25 = larger).
    - key: ui.kiosk_mode
      value: true
      data_type: bool
      description: Hide navigation chrome — full-screen single-task view.
    - key: offline.queue_size
      value: 50
      data_type: int
      description: Maximum problem-reports buffered locally when network drops.
  sandbox:
    description: Scenario simulation budgets + retention.
    settings:
    - key: scenario.budget_seconds
      value: 30
      data_type: int
      description: Per-scenario CPO time limit when sandbox runs the real engine.
    - key: scenario.max_active
      value: 5
      data_type: int
      description: How many SIMULATING scenarios may run in parallel per tenant.
    - key: scenario.retention_days
      value: 30
      data_type: int
      description: Soft-delete sandbox scenarios after this many days.
  twin:
    description: Digital-twin scenario horizon and comparison cap.
    settings:
    - key: scenario.default_horizon_days
      value: 14
      data_type: int
      description: Forward-look horizon for what-if scenarios.
    - key: scenario.cache_ttl_seconds
      value: 300
      data_type: int
      description: How long delta-view results are cached before recomputation.
    - key: comparison.max_pairs
      value: 4
      data_type: int
      description: Maximum scenarios shown side-by-side in the comparison view.
  ml:
    description: Retrain cadence, holdout fraction, promotion threshold.
    settings:
    - key: retrain.min_samples
      value: 200
      data_type: int
      description: Minimum new samples required before a retrain job runs.
    - key: retrain.window_days
      value: 90
      data_type: int
      description: Lookback window the retrainer pulls features from.
    - key: promotion.holdout_pct
      value: 0.15
      data_type: float
      description: Fraction of the dataset reserved for the holdout score.
    - key: promotion.min_score_improvement
      value: 0.02
      data_type: float
      description: Required uplift over the live model before a candidate is promoted.
  kpi_targets:
    description: OTD/FPY/rework targets shown on the CEO dashboard.
    settings:
    - key: otd_pct
      value: 95.0
      data_type: float
      description: On-Time Delivery target (%). Below this triggers a warning tile.
    - key: fpy_pct
      value: 80.0
      data_type: float
      description: First-pass yield target (%).
    - key: rework_pct
      value: 10.0
      data_type: float
      description: Maximum acceptable global rework rate (%).
    - key: wip_max_boats
      value: 540
      data_type: int
      description: WIP ceiling — Plan §2 estimated 220-540.
  dqa:
    description: Drift alert + freshness threshold + auto-repair toggle.
    settings:
    - key: drift.alert_threshold
      value: 0.2
      data_type: float
      description: Schema drift fraction above which an alert fires.
    - key: freshness.curated_max_age_h
      value: 24.0
      data_type: float
      description: Hours after which curated rows are flagged stale.
    - key: auto_repair.enabled
      value: false
      data_type: bool
      description: Run the auto-repair pipeline on quarantined rows.
  realtime:
    description: SSE heartbeat + Kafka toggle + outbox flush batching.
    settings:
    - key: sse.heartbeat_seconds
      value: 15
      data_type: int
      description: Server-sent-event heartbeat interval to keep middlebox proxies alive.
    - key: kafka.enabled
      value: false
      data_type: bool
      description: Toggle the Kafka publisher. When False the outbox table buffers.
    - key: outbox.flush_batch_size
      value: 100
      data_type: int
      description: How many outbox events the worker flushes per tick.
  session:
    description: Session timeout + step-up + remember-me lifetime.
    settings:
    - key: idle_timeout_minutes
      value: 60
      data_type: int
      description: Sign out idle sessions after this many minutes.
    - key: step_up.required_for_kill_switch
      value: true
      data_type: bool
      description: Require fresh password challenge before /governance/kill-switch.
    - key: remember_me_days
      value: 14
      data_type: int
      description: Persistent session length when 'manter ligado' is checked.
  dispatch:
    description: Despacho policy — advance/delay tolerance + client priority.
    settings:
    - key: advance.max_days
      value: 3
      data_type: int
      description: How many days early a boat may ship if the suggestion offers.
    - key: delay.tolerance_days
      value: 1
      data_type: int
      description: Tolerated slip before a delay suggestion fires.
    - key: client_priority.enabled
      value: true
      data_type: bool
      description: Honour the per-client priority list when suggesting regroupings.
  explain:
    description: Catalog cache + causal trace depth + fallback toggle.
    settings:
    - key: catalog.cache_ttl_seconds
      value: 300
      data_type: int
      description: How long the metrics catalog is cached in memory.
    - key: trace.max_depth
      value: 5
      data_type: int
      description: Mill's-method causal chain max recursion depth.
    - key: fallback.enabled
      value: true
      data_type: bool
      description: Render the static catalog when a real causal trace is unavailable.
  improve:
    description: Suggestion cooldown, auto-dismiss horizon, min confidence.
    settings:
    - key: suggestion.cooldown_days
      value: 7
      data_type: int
      description: Don't propose the same suggestion type twice within this window.
    - key: auto_dismiss_after_days
      value: 30
      data_type: int
      description: Suggestions ignored for this many days are soft-deleted.
    - key: min_confidence
      value: 0.6
      data_type: float
      description: Suggestions below this confidence stay in the operator backlog.
