<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NELO · ProdPlan ONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Background scale — deep, neutral, Palantir */
      --bg-0: oklch(0.158 0.008 250);
      --bg-1: oklch(0.195 0.008 250);
      --bg-2: oklch(0.225 0.009 250);
      --bg-3: oklch(0.265 0.010 250);

      /* Foreground scale */
      --fg-0: oklch(0.96 0.005 250);
      --fg-1: oklch(0.82 0.008 250);
      --fg-2: oklch(0.62 0.012 250);
      --fg-3: oklch(0.45 0.015 250);

      /* Borders */
      --bd-1: oklch(0.295 0.011 250);
      --bd-2: oklch(0.355 0.013 250);

      /* Status — desaturated, calm */
      --green:    oklch(0.78 0.14 155);
      --green-bg: oklch(0.30 0.07 155 / 0.20);
      --green-bd: oklch(0.45 0.10 155 / 0.40);

      --yellow:    oklch(0.82 0.14 90);
      --yellow-bg: oklch(0.32 0.08 80 / 0.20);
      --yellow-bd: oklch(0.50 0.12 80 / 0.40);

      --orange:    oklch(0.74 0.16 50);
      --orange-bg: oklch(0.32 0.09 50 / 0.20);
      --orange-bd: oklch(0.50 0.13 50 / 0.40);

      --red:    oklch(0.72 0.18 25);
      --red-bg: oklch(0.32 0.10 25 / 0.22);
      --red-bd: oklch(0.50 0.14 25 / 0.40);

      --blue:    oklch(0.72 0.14 245);
      --blue-bg: oklch(0.32 0.07 245 / 0.20);
      --blue-bd: oklch(0.50 0.10 245 / 0.40);

      --purple:    oklch(0.72 0.15 295);
      --purple-bg: oklch(0.32 0.08 295 / 0.20);
      --purple-bd: oklch(0.50 0.11 295 / 0.40);

      /* radii */
      --r-sm: 4px;
      --r-md: 6px;
      --r-lg: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; height: 100%; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: var(--bg-0);
      color: var(--fg-0);
      line-height: 1.45;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea, select { font-family: inherit; }
    h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; }
    .tabular { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    code, .mono { font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; }

    /* Scrollbars */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--bd-1); border-radius: 5px; border: 2px solid var(--bg-0); }
    *::-webkit-scrollbar-thumb:hover { background: var(--bd-2); }

    /* Animations */
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.85); }
    }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }

    /* Selection */
    ::selection { background: var(--blue-bg); color: var(--fg-0); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- order matters: data → icons → atoms → shell → copilot → pages → app -->
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/atoms.jsx"></script>
  <script type="text/babel" src="src/shell.jsx"></script>
  <script type="text/babel" src="src/copilot.jsx"></script>
  <script type="text/babel" src="src/page-ceo.jsx"></script>
  <script type="text/babel" src="src/page-inbox.jsx"></script>
  <script type="text/babel" src="src/page-scheduling.jsx"></script>
  <script type="text/babel" src="src/page-dispatch.jsx"></script>
  <script type="text/babel" src="src/page-oee.jsx"></script>
  <script type="text/babel" src="src/page-quality.jsx"></script>
  <script type="text/babel" src="src/page-workforce.jsx"></script>
  <script type="text/babel" src="src/page-extra.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
