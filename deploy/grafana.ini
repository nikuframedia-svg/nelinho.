; Q.68.2.D — Grafana config nativa (nelinho on-prem, sem Docker).
;
; Carregado pelo systemd unit (deploy/systemd/grafana.service) via:
;     --config=/opt/nelinho/deploy/grafana.ini
;
; Provisioning dos dashboards + datasource Prometheus vem do directório
; /etc/grafana/provisioning, que se aponta para os YAMLs aqui no repositório.
; Setup de provisioning (1× só, na instalação):
;
;   sudo mkdir -p /etc/grafana/provisioning/datasources \
;                 /etc/grafana/provisioning/dashboards \
;                 /var/lib/grafana/dashboards
;   sudo ln -sf /opt/nelinho/monitoring/grafana/provisioning/dashboards.yaml \
;               /etc/grafana/provisioning/dashboards/nelinho.yaml
;   sudo ln -sf /opt/nelinho/monitoring/grafana/dashboards \
;               /var/lib/grafana/dashboards/nelinho
;   sudo tee /etc/grafana/provisioning/datasources/prometheus.yaml <<'EOF'
;   apiVersion: 1
;   datasources:
;     - name: Prometheus
;       type: prometheus
;       uid: prometheus
;       url: http://localhost:9090
;       access: proxy
;       isDefault: true
;       editable: false
;   EOF
;   sudo chown -R grafana:grafana /etc/grafana /var/lib/grafana
;
; Notas:
;   * Admin password NUNCA aqui — vem de GF_SECURITY_ADMIN_PASSWORD em
;     /etc/grafana/env (lido pelo systemd unit).
;   * Anonymous é desligado: Grafana é só para o Luis e dois operadores.

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
enforce_domain = false
serve_from_sub_path = false

[database]
; SQLite chega para single-box; backup do ficheiro fica no rsync diário.
type = sqlite3
path = grafana.db

[security]
; Admin user / password vêm do env (GF_SECURITY_ADMIN_USER / _PASSWORD).
disable_initial_admin_creation = false
cookie_secure = false
cookie_samesite = lax
allow_embedding = false
strict_transport_security = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[log]
mode = console file
level = info

[metrics]
; Grafana expõe /metrics para o próprio Prometheus se scrapar (futuro).
enabled = true

[snapshots]
external_enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[unified_alerting]
; Alertas continuam em Prometheus (alerts.yml). Mantém Grafana só dashboards.
enabled = false

[alerting]
enabled = false

[dashboards]
; Reload automático quando o ficheiro JSON em monitoring/grafana/dashboards/
; muda — sem restart.
min_refresh_interval = 5s
versions_to_keep = 20
