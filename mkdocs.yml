# ProdPlan ONE — MkDocs site (Sprint J.4)
#
# Serve locally:  mkdocs serve
# Build:          mkdocs build -d site
# Deploy on-prem: Caddy already serves /docs (deploy/Caddyfile).
#                 Set its root to the mkdocs `site/` output dir.

site_name: ProdPlan ONE
site_description: >-
  Decision OS for the NELO factory — operator-facing docs,
  runbooks, and the SLA contract.
site_author: Nikufra Media
repo_url: https://github.com/nikuframedia-svg/nelinho
repo_name: nikuframedia-svg/nelinho
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Operations:
      - SLA: sla.md
      - Disaster recovery: disaster-recovery.md
      - Runbooks: runbooks/index.md
      - API down: runbooks/api-down.md
      - Postgres down: runbooks/postgres-down.md
      - Kafka down: runbooks/kafka-down.md
      - Ollama down: runbooks/ollama-down.md
      - Disk filling up: runbooks/disk-full.md
      - Replication lag: runbooks/replication-lag.md
      - High 5xx rate: runbooks/high-5xx-rate.md
      - TrustIndex collapsed: runbooks/trust-index-collapsed.md
      - Backup stale: runbooks/backup-stale.md
      - Incident template: runbooks/incident-template.md
  - Plans:
      - Mega-plan 24/04: 24-4.md
      - Plan 22/04: plano-22-04.md
      - Sprint I.2 CP-SAT TODO: sprint-I-2-cpsat-rolling-horizon-todo.md
      - Sprint J smoke tests: sprint-J-smoke-test.md
      - Sprint validation report: sprint-validation-report.md
  - Architecture:
      - Realtime (SSE): architecture/realtime.md
      - Learning loop: architecture/learning-loop.md
      - Causal stack: architecture/causal-stack.md
  - Governance:
      - Learned rules: governance/learned-rules.md
      - Adaptive weights: governance/adaptive-weights.md
