# Ruff config — Sprint Q.7 Fase 2
# ================================
# Rule set focused on REAL BUGS only (zero cosmetic). Plan v4 §11
# principle: "mudanças cirúrgicas".
#
# What we lint for:
#   F   — pyflakes (undefined names, unused imports, syntax errors)
#   E9  — pycodestyle E9 only (syntax errors)
#   B   — flake8-bugbear (mutable default args, except-Exception, etc)
#   PLE — pylint Errors (e.g. broken format strings)
#   RUF — ruff's own real-bug detectors
#   ASYNC — async/await misuses
#
# What we DO NOT lint for:
#   E1xx-E7xx (whitespace, indentation, line length)
#   W (warnings)
#   I (import sorting)
#   N (naming)
#   D (docstrings)
#   ANN (annotation hints)
#   COM, Q, EM (trivial style)
#
# Run:
#   ruff check src/{module} --no-fix
#   ruff check src/ --no-fix --output-format=concise

target-version = "py311"
line-length = 200  # don't flag long lines — we want bugs only

[lint]
# Q.173.AP — BLE001 é enforced FORA deste ruleset (scripts/lint_drift_gate.py
# corre `ruff --select BLE001` contra o baseline). `external` impede o RUF100
# de marcar os `# noqa: BLE001` (com razão, por site) como unused no ruff base.
external = ["BLE001"]
select = [
    "F",     # pyflakes — REAL BUGS (undefined names, unused imports)
    "E9",    # syntax errors only (skip E1xx-E7xx style)
    "B",     # flake8-bugbear — REAL BUGS (mutable defaults, etc)
    "PLE",   # pylint errors — REAL BUGS
    "RUF",   # ruff specific — mostly real bugs
    "ASYNC", # async misuses
    # Q.61.06 — stop-the-bleeding (Larson De-risk). BLE001 (370 violations
    # today) e demasiado grande para fix em massa; vive num drift gate
    # separado em scripts/lint_drift_gate.py. Estas duas sao manageable:
    "S110",  # try-except-pass — 10 sites, todos marcados # noqa com razao
    "T201",  # print() em src/ — 1 site (CLI tool), marcado # noqa
    # Q.168.B — datetime naive banido. datetime.utcnow() escrito em colunas
    # DateTime(timezone=True) / comparado com datetimes aware era a classe de
    # bugs Q.130.U (auditoria 2026-06-10: ~25 sites confirmados). Usar
    # src/shared/time.py: utc_now() (aware, default), utc_now_naive()
    # (SÓ colunas legacy sem tz + domínio CPO naive-consistente até F2) ou
    # local_today() (data de NEGÓCIO da fábrica) / local_now_naive() (hora
    # local p/ comparar com timestamps ERP local-naive — Q.171.E).
    "DTZ003",  # datetime.utcnow() — a classe de bugs varrida no Q.168.B
    "DTZ004",  # datetime.utcfromtimestamp() — mesma família
    "DTZ011",  # date.today() direto — usar local_today() (intenção explícita)
    # Q.171.E — restantes 27 sites varridos (local vs UTC decidido site a
    # site); naive-intencional leva noqa com razão (sort keys, dims Cube).
    "DTZ001",  # datetime() sem tzinfo
    "DTZ005",  # datetime.now() sem tz — usar utc_now()/local_now_naive()
    "DTZ007",  # strptime sem %z
    "DTZ901",  # datetime.min/max sem tz
]

# Allow common patterns that aren't real bugs in this codebase
ignore = [
    "B008",   # Function call in default arg — common in FastAPI Depends()
    "B904",   # raise without `from` — too many existing instances, low value
    "B028",   # warn missing stacklevel — cosmetic
    "B905",   # zip without explicit strict — cosmetic
    "RUF001", # ambiguous unicode chars — false positives from PT comments
    "RUF002", # same as above for docstrings
    "RUF003", # same as above for inline comments
    "RUF012", # mutable class attribute should be ClassVar — too noisy
    "RUF022", # __all__ unsorted — cosmetic
    "RUF013", # implicit Optional — cosmetic, mypy catches the real issues
    "F401",   # imported but unused — many __init__.py re-exports
    "F403",   # star imports — pre-existing pattern in some places
    "F405",   # undefined-from-star — same as above
    "ASYNC240", # pathlib metadata ops (.exists/.resolve/.unlink) in async
                # fns — microsecond-scale, too noisy for a "real bugs only"
                # set; hot-path I/O is revisited in a perf sub-sprint.
]

[lint.per-file-ignores]
# Q.171.E — periods.py resolve períodos PT ("este mês", "março") para
# janelas do Cube, cujas dims de data são naive LOCAIS (espelho ERP).
# Todo o ficheiro trabalha naive de propósito; aware aqui estaria errado.
"src/copilot/cube/periods.py" = ["DTZ001", "DTZ005"]
# Test code is DAMP and full of throwaway bindings — relax the
# "unused/style" detectors that fire on fixtures and assertions.
# S110 (try-except-pass): tests usam para verificar side-effects
# (e.g. mock_upsert.await_count > 0) mesmo quando o fluxo falha — é
# intencional e não dá para mascarar com noqa em todos os sítios.
"tests/**/*.py" = [
    "F841", "B011", "B017", "B018",
    "RUF059", "B007", "RUF005", "RUF007", "RUF009", "RUF015",
    "S110",
    # Q.168.B — datas fixas/naive em fixtures de teste são inofensivas;
    # o ban DTZ aplica-se ao código de produção (src/).
    "DTZ001", "DTZ003", "DTZ004", "DTZ005", "DTZ007", "DTZ011", "DTZ901",
]
"alembic/versions/*.py" = ["E402", "F401"]  # migrations are special
# Ad-hoc one-off scripts — not production code; relax unused/style noise.
# T201 (print): scripts/ são CLI tools, print() é o output canónico.
# S110 (try-except-pass): defensivo em CLI tools que não devem crashar em
# best-effort cleanup; manter como warning local mas não falhar o CI.
"scripts/**/*.py" = ["E402", "F841", "B007", "RUF005", "RUF046", "T201", "S110"]
