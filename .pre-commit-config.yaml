# Guardrails de pré-commit (Q.60.B) — feedback antes do CI.
#
# Activar uma vez por checkout:  pip install pre-commit && pre-commit install
# Inerte até lá: quem não o instala faz commits normalmente — não bloqueia.
#
# Filosofia (igual ao ruff.toml): só REAL BUGS, nada cosmético. O ESLint cheio
# (~665 erros pré-existentes) NÃO entra aqui — só o gate anti-MOCK, que é limpo.
repos:
  # --- Backend: ruff lint (lê o ruff.toml do repo, só corre nos .py staged) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        name: ruff (lint backend)

  # --- Frontend: hooks locais, correm quando ficheiros frontend são tocados ---
  - repo: local
    hooks:
      - id: frontend-zero-mocks
        name: ZERO MOCKS (eslint anti-MOCK)
        entry: npm --prefix frontend run lint:mocks
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$

      - id: frontend-typecheck
        name: tsc --noEmit (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      # --- Backend: Q.61.08 — guardrails de invariantes estaticas + drift gate ---
      # Sem suite pytest (VERIFY_INVARIANTS_SKIP_TESTS=1 — corre no CI proprio).
      # Total ~3s combinado: invariantes estaticas (CX/C/F/E/D/ST/WG/CO/ME/H0
      # + AST testes vazios) + lint drift gate (BLE001 + Q61_07_no_direct_fetch).
      - id: verify-invariants-static
        name: scripts/verify_invariants.py (sem testes)
        entry: pwsh -NoProfile -Command "$env:VERIFY_INVARIANTS_SKIP_TESTS='1'; $env:PYTHONPATH='.'; .\.venv\Scripts\python.exe scripts/verify_invariants.py"
        language: system
        pass_filenames: false
        files: ^(src/|tests/|scripts/).+\.py$

      - id: lint-drift-gate
        name: scripts/lint_drift_gate.py (BLE001 + Q.61.07)
        entry: pwsh -NoProfile -Command "$env:PYTHONPATH='.'; .\.venv\Scripts\python.exe scripts/lint_drift_gate.py"
        language: system
        pass_filenames: false
        files: ^(src/|frontend/src/).+\.(py|ts|tsx)$

      # --- Q.66.C.1 — bloqueia @pytest.mark.skip/.xfail sem GH issue link ---
      # Anti-test-cheating: agente AI nao pode silenciar testes para fazer
      # "verde". Pre-commit local + CI ambos correm. `--no-verify` continua
      # uma flag client-side (sem hook fiavel para bloquear); o gate real
      # vive no CI do GitHub que sempre corre, independente da flag.
      - id: lint-skip-tests
        name: pytest.mark.skip sem GH issue
        entry: pwsh -NoProfile -Command ".\.venv\Scripts\python.exe tools/lint_skip_tests.py tests/"
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$
