cubes:
  - name: ambiental_cura_horas
    description: >
      Q.100 Medida 1 — horas de cura química acumuladas por ciclo de
      estufa. Fonte: marts.v_ciclos_cura (1 row por ciclo). Definição
      de ciclo: janela contínua T>=65°C, gap separador >60min, duração
      mínima >=1h. Anchor Q.100 Fase 0: Estufa 60 (sensor 12) em Abril
      2026 = 13 ciclos / 150.6 h (médio 11.58 h, pico 79.4°C, padrão
      noturno ~19h→07h overnight). Aditivo entre estufas e meses
      (TEMPO somam livremente — h+h=h). A medida vive como
      `ambiental_cura_horas.total` no registo do contrato.
    sql_table: marts.v_ciclos_cura

    measures:
      - name: total
        description: >
          Horas em cura. SUM(duracao_h) da view (cada row = 1 ciclo
          com duracao_h = MAX(ts)-MIN(ts) do ciclo). TEMPO é canónico
          em horas. Anchor Estufa 60 Abril 2026: SUM(total) = 150.6
          (13 ciclos).
        sql: duracao_h
        type: sum
        format: number

      - name: ciclos
        description: >
          Contagem de ciclos. COUNT(*) da view. Útil em narrações
          ("13 ciclos com 150.6 h em Abril"). CONTAGEM adimensional.
        sql: ts_inicio
        type: count
        format: number

    dimensions:
      - name: data
        description: >
          Primeiro dia do mês de início do ciclo (DATE_TRUNC('month',
          ts_inicio)::date). Granularidade mensal — o range
          dateRange=["2026-04-01","2026-04-30"] devolve só ciclos
          iniciados em Abril (ciclo iniciado a 19h dia 30 entra
          Abril; iniciado a 19h dia 31 entra Maio, mesmo que termine
          a 07h dia 1 Maio).
        sql: data
        type: time

      - name: estufa
        description: >
          Nome da estufa (SENSOR_NAME). Valores observados:
          'Temperatura Estufa 60' (top — 51 ciclos / 590.6 h ano),
          'Estufa 30' (5 ciclos / 15.8 h ano), 'Estufa Peças'
          (0 ciclos T>=65 no espelho — só atinge max 48.3°C).
          Filtro literal — usar contains 'estufa' para agregar todas.
        sql: estufa
        type: string

      - name: sensor_id
        description: >
          ID numérico do sensor IoT. Valores activos: 12 (Estufa 60),
          14 (Estufa 30), 17 (Estufa Peças). Útil para drill-down
          técnico e cross-join com diagnóstico de manutenção.
        sql: sensor_id
        type: number

      - name: temp_max
        description: >
          Temperatura máxima atingida no ciclo (°C). NÃO é uma medida
          agregável (MAX/AVG, não SUM) — exposta como dimension
          para filtrar ciclos específicos ("ciclos com pico ≥75°C")
          mas o LLM NÃO deve somá-la. Para somar temperaturas, será
          necessária CanonicalUnit.TEMPERATURA + agregação MAX —
          fora de escopo Q.100 (parar e reportar para futura medida
          ambiental.cura_temp_max).
        sql: temp_max
        type: number
