cubes:
  - name: consumo_by_of
    description: >
      Q.108.G / Q.173.AJ — Consumo material por OF (preservando erp_of_id).
      Source: marts.v_consumo_by_of_dia sobre supply.inventory_ledger_entries
      (erp_of_id = INTEGER FK para OF_FP, adicionado em Q.173.F).
      Destrava margem por OF + `corr_custo_por_of_vs_facturacao`.
    sql_table: marts.v_consumo_by_of_dia

    measures:
      - name: custo_eur
        description: >
          SUM(qty_out x P_PRECOCUSTO) por (dia, erp_of_id, sku).
          DINHEIRO aditivo. Para custo TOTAL por OF: filtrar/agrupar por
          erp_of_id sem time.
        sql: custo_eur
        type: sum
        format: number

      - name: consumo_qty
        description: SUM qty_out (em unidades-base do produto).
        sql: consumo_qty
        type: sum
        format: number

      - name: n_movimentos
        description: COUNT movimentos de consumo (CONTAGEM).
        sql: n_movimentos
        type: sum
        format: number

    dimensions:
      - name: data
        sql: data
        type: time
      - name: erp_of_id
        description: ERP OF_ID (INTEGER) da ordem de fabrico.
        sql: erp_of_id
        type: number
      - name: sku_id
        description: P_ID stringificada (chave material).
        sql: sku_id
        type: string
      - name: material
        description: P_NOME canonico do material.
        sql: material
        type: string
