cubes:
  - name: plataforma_copilot_latency
    description: >
      Q.108.L.2 — Latency do copilot por dia × route. Source:
      marts.v_copilot_latency_dia sobre copilot_request_log.
    sql_table: marts.v_copilot_latency_dia

    measures:
      - name: requests
        description: COUNT total requests por (dia, route).
        sql: n_requests
        type: sum
        format: number

      - name: abstain
        description: COUNT requests com status=abstain.
        sql: n_abstain
        type: sum
        format: number

      - name: errors
        description: COUNT requests com status=error.
        sql: n_error
        type: sum
        format: number

      - name: latency_avg
        description: AVG latency em milissegundos. TEMPO; cross-row AVG.
        sql: latency_avg_ms
        type: avg
        format: number

      - name: latency_p50
        description: P50 latency (mediana) por (dia, route).
        sql: latency_p50_ms
        type: avg
        format: number

      - name: latency_p95
        description: P95 latency — SLA target principal.
        sql: latency_p95_ms
        type: avg
        format: number

      - name: latency_p99
        description: P99 latency — worst case.
        sql: latency_p99_ms
        type: avg
        format: number

    dimensions:
      - name: data
        sql: data
        type: time
      - name: route
        sql: route
        type: string
