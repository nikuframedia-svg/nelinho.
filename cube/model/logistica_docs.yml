cubes:
  - name: logistica_docs
    description: >
      Q.108.B2 — documentação dos transportes (TRANSP_DOCS espelhada
      em Q.108-A). Cada linha = 1 documento (CMR, factura, packing list,
      etc) associado a um transporte. TRDOC_TRATADO flag indica se foi
      processado. View v_transp_docs_mes agrega por mês.
      COBERTURA: 64% das rows (29 969 / 46 917) têm TRDOC_DATA — os
      restantes 16 948 sem data são docs históricos não datados.
      Métrica usa apenas rows datadas.
    sql_table: marts.v_transp_docs_mes

    measures:
      - name: emitidos_total
        description: >
          Q.108.B2 — total de documentos de transporte emitidos
          (com TRDOC_DATA preenchida). Anchor histórico = 29 969 docs
          datados. 2024 = 1 397 docs. CONTAGEM aditiva entre meses.
        sql: n_docs
        type: sum
        format: number

      - name: tratados_total
        description: >
          Q.108.B2 — sub-contagem de docs com TRDOC_TRATADO=TRUE
          (processados pela logística). Anchor histórico = 29 949
          tratados / 29 969 (99.9%); 2024 = 1 394 / 1 397.
        sql: n_tratados
        type: sum
        format: number

      - name: pendentes_total
        description: >
          Q.108.B2 — docs com TRDOC_TRATADO=FALSE ou NULL (por
          processar). Anchor histórico = 20 pendentes; 2024 = 3
          pendentes. Indicador de backlog logístico residual.
        sql: n_pendentes
        type: sum
        format: number

    dimensions:
      - name: data
        sql: data
        type: time
