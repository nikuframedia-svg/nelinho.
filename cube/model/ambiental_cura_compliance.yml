cubes:
  - name: ambiental_cura_compliance
    description: >
      Q.108.W1 — Compliance % dos ciclos de cura química. Universo: ciclos
      que atingiram threshold do alarme (T>=45°C). Compliant = T_max>=65°C
      E duracao_h>=1h. Source: marts.v_cura_compliance_mes (1 row por
      mês × estufa × sensor). Ratio measure no Cube — NUNCA SUM(taxa);
      SUM(ciclos_compliant)/NULLIF(SUM(total_ciclos),0).
    sql_table: marts.v_cura_compliance_mes

    measures:
      - name: taxa
        description: >
          Compliance % = SUM(ciclos_compliant)/SUM(total_ciclos).
          FRACAO (0-1 interno; apresentar como % na narração). Destrava
          a correlação `corr_temp_avg_vs_compliance_cura`.
        sql: "SUM(ciclos_compliant)::float / NULLIF(SUM(total_ciclos), 0)"
        type: number
        format: percent

      - name: total
        description: >
          Contagem ABSOLUTA de ciclos que atingiram T>=45°C — universo
          dos ciclos "tentados". CONTAGEM, aditiva entre meses e estufas.
        sql: total_ciclos
        type: sum
        format: number

      - name: compliant
        description: >
          Contagem de ciclos compliant (T_max>=65 AND duracao>=1h).
          Numerador isolado da taxa. CONTAGEM aditiva.
        sql: ciclos_compliant
        type: sum
        format: number

    dimensions:
      - name: data
        description: Mês de início do ciclo (date_trunc('month')).
        sql: data
        type: time

      - name: estufa
        description: SENSOR_NAME canónico (Estufa 60, Estufa 30, Estufa Peças).
        sql: estufa
        type: string

      - name: sensor_id
        description: Sensor IoT físico (para drill-down dentro da mesma estufa).
        sql: sensor_id
        type: number
