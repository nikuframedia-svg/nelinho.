cubes:
  - name: operadores_horas
    description: >
      Q.108.M — Horas de mão-de-obra real por (mês × operador × fase).
      Source: marts.v_horas_operador_mes sobre factory_raw.apontamento_trabalho
      (mirror Q.108.M com assunção canónica de schema).
    sql_table: marts.v_horas_operador_mes

    measures:
      - name: horas_total
        description: >
          SUM(AT_HORAS) por (mês, operador, fase). TEMPO; aditiva entre
          fases e operadores no mesmo mês.
        sql: horas_total
        type: sum
        format: number

      - name: n_apontamentos
        description: COUNT entradas de apontamento. CONTAGEM aditiva.
        sql: n_apontamentos
        type: sum
        format: number

      - name: n_ofs_distintas
        description: >
          COUNT(DISTINCT OF) já pré-computado por linha; NÃO somar entre
          meses (mesma OF aparece em vários meses).
        sql: n_ofs_distintas
        type: sum
        format: number

    dimensions:
      - name: data
        sql: data
        type: time
      - name: operador_id
        sql: operador_id
        type: number
      - name: fase_id
        sql: fase_id
        type: number
      - name: fase
        sql: fase
        type: string
