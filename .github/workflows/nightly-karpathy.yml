name: Nightly Karpathy Loop

# Substitui o routine claude.ai (trig_011isdCFgbR3NfefE4RAmn84) que ficou
# bloqueado pelo issue #13212 do claude-code (git proxy nao corre no
# sandbox CCR remoto). GitHub Actions runner tem auth GitHub nativa via
# GITHUB_TOKEN, logo `git push` funciona out-of-the-box.

on:
  schedule:
    # 30 1 * * *  =  01:30 UTC  =  02:30 Lisbon WEST (Verao) / 01:30 WET (Inverno).
    # Mudar manualmente para `30 2 * * *` no Outono para preservar 02:30 local.
    - cron: '30 1 * * *'
  workflow_dispatch:        # botao "Run workflow" no GitHub UI para teste manual
    inputs:
      duration_minutes:
        description: 'Janela de trabalho em minutos (default 110, max 350)'
        required: false
        default: '110'
        type: string

permissions:
  contents: write           # criar e push branches `nightly/*`
  pull-requests: write      # abrir PRs automaticamente
  id-token: write           # OIDC para o claude-code-action v1

concurrency:
  # Se a sessao de ontem ainda nao acabou (improvavel mas possivel), cancela
  # a antiga em vez de duplicar. So uma sessao Karpathy a correr de cada vez.
  group: nightly-karpathy
  cancel-in-progress: false  # nao matamos uma corrida em curso

jobs:
  karpathy:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # 2h hard cap (cabe no free tier do GitHub Actions)

    steps:
      - name: Generate GitHub App installation token
        # Usa a App `nelinhogfsfbxcbxcbxcxcbcx` (App ID 3631645) em vez do
        # GITHUB_TOKEN default. Razao: PRs criados pela App disparam workflows
        # CI normalmente (GITHUB_TOKEN nao dispara workflows downstream para
        # evitar loops infinitos), e a App tem identidade propria no audit log.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repo (full history for branch analysis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # precisa da historia toda para `git diff main..branch`
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Best-effort install — tests podem precisar de mais; o agente
          # decide se vale a pena pip install algo extra durante a sessao.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure git author for nightly commits
        # Identidade do bot da App. O formato `<id>+<slug>[bot]@users.noreply.github.com`
        # e a convencao GitHub para commits feitos via App installation token.
        run: |
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"

      - name: Load Karpathy prompt from file
        # claude-code-action@v1 nao tem `prompt_file` (so `prompt`).
        # Lemos o ficheiro para um output e passamos como string.
        id: load-prompt
        run: |
          {
            echo 'content<<KARPATHY_EOF'
            cat .github/prompts/nightly-karpathy.md
            echo 'KARPATHY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        env:
          # Passar token da App ao agente para que `gh` e `git push`
          # corram com a identidade da App, nao com GITHUB_TOKEN.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: ${{ steps.load-prompt.outputs.content }}
          # claude_args agrupa flags que costumavam ser inputs separados.
          # --max-turns 100 da folga para 2h de trabalho real (cada turn
          # = uma resposta do modelo). Modelo Opus 4.6 escolhido na conversa.
          claude_args: '--max-turns 100 --model claude-opus-4-6 --allowed-tools Bash,Read,Write,Edit,Glob,Grep,Task'

      - name: Show created branches
        if: always()
        run: |
          echo "=== Branches nightly criadas nesta sessao ==="
          git for-each-ref --format='%(refname:short) %(committerdate:short)' \
            refs/heads/nightly/ 2>&1 | head -20 || echo "(nenhuma)"
          echo ""
          echo "=== Branches no remote ==="
          git ls-remote --heads origin 'nightly/*' 2>&1 | head -20 || echo "(nenhuma)"
