name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # 20min: a suite cresceu e requirements-test.txt passou a incluir
    # engines mais pesados (dowhy/tigramite/scipy) — install + run não
    # cabem nos 10min originais.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # Q.59.B.2 — ruff as a real-bugs-only gate (config in ruff.toml).
      # Runs before pytest so a lint regression fails fast and cheap.
      - name: Lint (ruff)
        run: ruff check src/ tests/ alembic/ scripts/ --no-fix

      - name: Run pytest with coverage
        # Q.59.B.1 — coverage measured over the whole `src/`, not just
        # three hand-picked files. No `--cov-fail-under` gate yet: this
        # widens the report; a threshold lands in a later sub-sprint.
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Verificar invariantes do CPO (Q.60.C)
        # Static + dynamic checks de scripts/verify_invariants.py (12 invariantes
        # do scheduler/GA — ver .claude/skills/nelinho-invariants). O test-floor
        # e saltado: o passo de pytest acima ja corre a suite completa.
        env:
          VERIFY_INVARIANTS_SKIP_TESTS: "1"
        run: python scripts/verify_invariants.py

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # Q.59.B.1 — frontend gate. `tsc` and Vitest both pass clean today, so
  # wiring them now genuinely guards regressions. `eslint` (665 errors)
  # and `mypy` are deferred to their own clean-up sub-sprints — gating on
  # a tool that is already red would just leave CI permanently red.
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npx tsc -b --noEmit

      - name: Unit tests (Vitest)
        run: npm run test
